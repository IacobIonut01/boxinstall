name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n boxinstall
          bash -n install.sh
          bash -n uninstall.sh
          bash -n completions/boxinstall.bash
          bash -n .githooks/commit-msg
          bash -n scripts/setup-dev.sh
          python3 -m py_compile manager.py

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck boxinstall install.sh uninstall.sh completions/boxinstall.bash
          shellcheck .githooks/commit-msg scripts/setup-dev.sh

      - name: Desktop entry validation
        run: |
          sudo apt-get install -y desktop-file-utils
          sed 's|@BIN@|/home/runner/.local/bin/boxinstall|g' boxinstall.desktop.in > /tmp/boxinstall.desktop
          desktop-file-validate /tmp/boxinstall.desktop
          sed 's|@BIN@|/home/runner/.local/bin/boxinstall|g' boxinstall-manage.desktop.in > /tmp/boxinstall-manage.desktop
          desktop-file-validate /tmp/boxinstall-manage.desktop

      - name: Management command smoke test
        run: |
          ./boxinstall --version
          ./boxinstall list --json > /tmp/apps.json
          python3 - <<'PY'
          import json
          with open("/tmp/apps.json") as fh:
              apps = json.load(fh)
          assert isinstance(apps, list)
          print(f"Discovered {len(apps)} app(s)")
          PY

      - name: Tarball detection smoke test
        run: |
          mkdir -p /tmp/tarball-test/App
          printf '#!/bin/sh\nexit 0\n' > /tmp/tarball-test/App/app
          chmod +x /tmp/tarball-test/App/app
          tar -czf /tmp/boxinstall-test.tar.gz -C /tmp/tarball-test App
          ./boxinstall --dry-run --no-gui /tmp/boxinstall-test.tar.gz | tee /tmp/tarball.log
          grep -q 'tar archive' /tmp/tarball.log
